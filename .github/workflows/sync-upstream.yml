name: Sync upstream
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Merge upstream default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/yunxiiQwQ/dsh-maid-whale-webUI.git 2>/dev/null \
            || git remote set-url upstream https://github.com/yunxiiQwQ/dsh-maid-whale-webUI.git
          git fetch upstream --tags
          BRANCH="${{ github.event.repository.default_branch }}"
          UP=$(git ls-remote --symref upstream HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2}')
          echo "fork branch=$BRANCH upstream branch=$UP"
          if git merge-base --is-ancestor "upstream/$UP" "HEAD"; then
            echo "Already up to date."
            exit 0
          fi
          git merge "upstream/$UP" --no-edit -m "chore: sync upstream ($(date -u +%F))"
          git push origin "HEAD:$BRANCH"
